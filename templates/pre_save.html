<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pre-Save Song</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet" />
  </head>
  <body class="bg-gray-900 text-white">
    <!-- Navigation Bar -->
    <nav class="bg-gray-800 fixed top-0 left-0 right-0 z-50">
      <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
        <div class="relative flex h-20 items-center justify-between">
          <!-- Set height to match the navbar height -->
          <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
            <div class="flex flex-shrink-0 items-center">
              <img class="h-12 w-auto" src="{{ url_for('static', filename='images/logo.png') }}" alt="Your Company" style="width: 75px;" /> <!-- Adjusted logo height -->
            </div>
            <div class="hidden sm:ml-6 sm:block">
              <div class="flex space-x-6">
                <!-- Menu items -->
                <a href="#" class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Home</a>
                <a href="#" class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white">About</a>
                <a href="#" class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Contact</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- Hero Content -->
    <div class="flex flex-col items-center justify-center min-h-screen pt-20">
      <!-- Adjusted padding-top to match navbar height -->
      <div class="text-center">
        <h1 class="text-4xl font-bold mb-6">New Song Coming Soon</h1>
        <p class="text-lg mb-4">Pre-Save it now to be the first to hear it when it drops!</p>
        <iframe class="spotify-embed" src="https://open.spotify.com/embed/artist/1TpW0FLoBboVFEH42ynib2?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        <div class="flex justify-center mt-4">
          <a href="#" class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600 transition duration-200">Pre-Save on Spotify</a>
        </div>
      </div>
    </div>
  </body>
</html>
